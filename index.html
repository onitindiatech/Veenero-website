    <!-- Polyfill crypto.randomUUID for browser extension compatibility -->
    <!-- This must run synchronously BEFORE extension content scripts inject -->
    <script>
      if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
        crypto.randomUUID = function() {
          var hex = Array.from(crypto.getRandomValues(new Uint8Array(16)), function(b) {
            return b.toString(16).padStart(2, '0');
          });
          hex[6] = ((parseInt(hex[6], 16) & 0x0f) | 0x40).toString(16);
          hex[8] = ((parseInt(hex[8], 16) & 0x3f) | 0x80).toString(16);
          return hex.slice(0, 4).join('') + '-' + hex.slice(4, 6).join('') + '-' + hex.slice(6, 8).join('') + '-' + hex.slice(8, 10).join('') + '-' + hex.slice(10).join('');
        };
      }
    </script>
