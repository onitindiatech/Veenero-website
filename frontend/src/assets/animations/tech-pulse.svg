<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .tech-spin-ccw {
        animation: spinCcw 10s linear infinite;
        transform-origin: center;
      }
      .tech-spin-cw {
        animation: spinCw 14s linear infinite;
        transform-origin: center;
      }
      .signal-pulse {
        animation: pulseSignal 2s ease-in-out infinite alternate;
        transform-origin: center;
      }
      @keyframes spinCw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCcw {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseSignal {
        0% { transform: scale(0.85); opacity: 0.6; }
        100% { transform: scale(1.1); opacity: 1; }
      }
    </style>
  </defs>
  <!-- Outer segmented orbit -->
  <g class="tech-spin-cw">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="30 15 5 15" opacity="0.7"/>
    <circle cx="180" cy="100" r="4" fill="#38BDF8"/>
    <circle cx="20" cy="100" r="4" fill="#38BDF8"/>
  </g>
  <!-- Inner counter-rotating ring -->
  <g class="tech-spin-ccw">
    <circle cx="100" cy="100" r="55" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="15 10 40 10" opacity="0.9"/>
    <circle cx="100" cy="45" r="5" fill="#14B8A6"/>
  </g>
  <!-- Center Core Node -->
  <circle class="signal-pulse" cx="100" cy="100" r="30" fill="#0F4C5C" opacity="0.6"/>
  <circle class="signal-pulse" cx="100" cy="100" r="20" fill="#14B8A6"/>
  <circle cx="100" cy="100" r="8" fill="#FFFFFF"/>
</svg>
