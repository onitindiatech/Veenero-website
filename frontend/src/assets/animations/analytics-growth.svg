<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F4C5C" stop-opacity="0.3"/>
    </linearGradient>
    <style>
      .bar-1 { animation: growBar 2.5s ease-out infinite alternate; transform-origin: bottom; }
      .bar-2 { animation: growBar 2.5s ease-out infinite alternate 0.4s; transform-origin: bottom; }
      .bar-3 { animation: growBar 2.5s ease-out infinite alternate 0.8s; transform-origin: bottom; }
      .bar-4 { animation: growBar 2.5s ease-out infinite alternate 1.2s; transform-origin: bottom; }
      .trend-line {
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: drawLine 3s ease-in-out infinite alternate;
      }
      .node-pulse { animation: pulseDot 1.5s ease-in-out infinite alternate; }
      @keyframes growBar {
        0% { transform: scaleY(0.4); }
        100% { transform: scaleY(1); }
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0% { transform: scale(0.8); opacity: 0.6; }
        100% { transform: scale(1.3); opacity: 1; }
      }
    </style>
  </defs>
  <!-- Background Grid lines -->
  <line x1="20" y1="150" x2="220" y2="150" stroke="#14B8A6" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="20" y1="100" x2="220" y2="100" stroke="#14B8A6" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <line x1="20" y1="50" x2="220" y2="50" stroke="#14B8A6" stroke-opacity="0.15" stroke-dasharray="4 4"/>

  <!-- Analytics Bars -->
  <rect class="bar-1" x="35" y="90" width="24" height="60" rx="4" fill="url(#barGrad)"/>
  <rect class="bar-2" x="80" y="70" width="24" height="80" rx="4" fill="url(#barGrad)"/>
  <rect class="bar-3" x="125" y="45" width="24" height="105" rx="4" fill="url(#barGrad)"/>
  <rect class="bar-4" x="170" y="25" width="24" height="125" rx="4" fill="url(#barGrad)"/>

  <!-- Overlay Trend Wave Line -->
  <path class="trend-line" d="M 47,90 Q 92,60 137,45 T 182,25" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <circle class="node-pulse" cx="182" cy="25" r="5" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
</svg>
