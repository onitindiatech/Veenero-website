<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="rippleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F4C5C" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ring-1 {
        animation: pulseRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        transform-origin: center;
      }
      .ring-2 {
        animation: pulseRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 1s;
        transform-origin: center;
      }
      .ring-3 {
        animation: pulseRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 2s;
        transform-origin: center;
      }
      .core-glow {
        animation: corePulse 2s ease-in-out infinite alternate;
        transform-origin: center;
      }
      @keyframes pulseRing {
        0% {
          r: 10px;
          opacity: 0.9;
          stroke-width: 3px;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          r: 85px;
          opacity: 0;
          stroke-width: 1px;
        }
      }
      @keyframes corePulse {
        0% { transform: scale(0.9); opacity: 0.7; }
        100% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#rippleGlow)" opacity="0.3" />
  <circle class="ring-1" cx="100" cy="100" r="20" fill="none" stroke="#38BDF8" stroke-width="2" />
  <circle class="ring-2" cx="100" cy="100" r="20" fill="none" stroke="#14B8A6" stroke-width="2" />
  <circle class="ring-3" cx="100" cy="100" r="20" fill="none" stroke="#38BDF8" stroke-width="2" />
  <circle class="core-glow" cx="100" cy="100" r="14" fill="#38BDF8" />
  <circle class="core-glow" cx="100" cy="100" r="6" fill="#FFFFFF" />
</svg>
